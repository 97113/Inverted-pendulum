; PlatformIO Project Configuration
;
; Wheeled inverted-pendulum RC robot
;   MCU     : M5Stack Core2 (ESP32-D0WDQ6-V3)
;   CAN I/F : M5Stack PwrCAN Module 13.2 (CA-IS3050G, isolated)
;   Motors  : RobStride EduLite 02 x2 (CAN, 1 Mbps, 29-bit extended frames)
;   Gamepad : Xbox Series X|S controller (BLE)

[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_unflags =
    -std=gnu++11

lib_deps =
    m5stack/M5Unified@^0.2.7
    asukiaaa/XboxSeriesXControllerESP32_asukiaaa@^1.1.1
